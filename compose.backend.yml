services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: offgrid
      POSTGRES_DB: offgrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a locally generated secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - offgrid_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offgrid -d offgrid"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  offgrid_pg:
