name: OFFGRID CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop, feature/shared-contract-v1 ]

jobs:
  lint-and-typecheck:
    name: Monorepo Node/TS Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 12.9.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Generated Contract Types
        run: pnpm run contract:types:check

      - name: Verify Workspace Structure
        run: ./scripts/verify-workspace.sh

      # Services consume the shared packages' emitted declarations.
      - name: Build Packages & Services
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test


  backend-postgres:
    name: Backend integration / PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: offgrid
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: offgrid_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U offgrid -d offgrid_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://offgrid:ci-ephemeral-only@127.0.0.1:5432/offgrid_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run contract:types:check
      - run: pnpm --filter @offgrid/shared-types build
      - run: pnpm --filter @offgrid/api-server build
      - run: pnpm --filter @offgrid/api-server test:integration
